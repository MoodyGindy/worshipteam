<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .loading .login-button {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 تسجيل الدخول</h1>
            <p>لوحة تحكم المشرف</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-button">دخول</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="forgot-password.html" style="color: #667eea; text-decoration: none; font-size: 0.9rem;">نسيت كلمة المرور؟</a>
            <br>
            <a href="test_admin_setup.php" style="color: #999; text-decoration: none; font-size: 0.8rem; margin-top: 10px; display: inline-block;">🔍 اختبار الإعداد</a>
        </div>
    </div>

    <script>
        // Auto-detect API URL from current page location
        function getApiUrl() {
            const currentPath = window.location.pathname;
            // Try to detect if we're in /worshipTeam/ or /worshipteam/ or root
            const baseMatch = currentPath.match(/^\/([^\/]+)/);
            const base = baseMatch ? baseMatch[1] : 'worshipTeam';
            
            // Try different possible paths
            const possibleUrls = [
                `https://${window.location.host}/${base}/api`,
                `https://${window.location.host}/worshipTeam/api`,
                `https://${window.location.host}/worshipteam/api`,
                `https://kdsc.fun/worshipTeam/api`,
                `https://kdsc.fun/worshipteam/api`
            ];
            
            // Return first one (will try others if this fails)
            return possibleUrls[0];
        }
        
        const API_URL = getApiUrl();
        console.log('API URL:', API_URL);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = form.querySelector('.login-button');

            // Get form data
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Validate
            if (!username || !password) {
                showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            // Show loading state
            form.classList.add('loading');
            loginButton.textContent = 'جاري التحقق...';
            errorMessage.classList.remove('show');

            try {
                // Try multiple endpoints in case path differs
                const endpoints = [
                    `${API_URL}/admin-login.php`,
                    `https://${window.location.host}/worshipTeam/api/admin-login.php`,
                    `https://${window.location.host}/worshipteam/api/admin-login.php`,
                    `${API_URL}/admin-login`,
                    `https://${window.location.host}/worshipTeam/api/admin-login`,
                    `https://${window.location.host}/worshipteam/api/admin-login`
                ];
                
                let response;
                let lastError;
                
                // Try each endpoint until one works
                for (const endpoint of endpoints) {
                    try {
                        console.log('Trying endpoint:', endpoint);
                        response = await fetch(endpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            credentials: 'include',
                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        });

                        // If we got a response (even 404), check if it's not an error
                        if (response.status === 404) {
                            // Try next endpoint
                            continue;
                        }
                        
                        // If we got a non-404 response, use it
                        break;
                    } catch (err) {
                        console.warn('Endpoint failed:', endpoint, err);
                        lastError = err;
                        // Try next endpoint
                        continue;
                    }
                }
                
                // If no endpoint worked, throw error
                if (!response) {
                    throw new Error('لا يمكن الوصول إلى الخادم. يرجى التحقق من المسار.');
                }

                // Check if response is OK
                if (!response.ok) {
                    const errorText = await response.text();
                    let errorData;
                    try {
                        errorData = JSON.parse(errorText);
                    } catch (e) {
                        errorData = { error: `HTTP ${response.status}: ${response.statusText}` };
                    }
                    throw new Error(errorData.error || 'خطأ في الاتصال بالخادم');
                }

                const data = await response.json();
                console.log('Login response:', data);

                if (data.success) {
                    // Store session token
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUsername', username);
                    
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    showError(data.error || 'اسم المستخدم أو كلمة المرور غير صحيح');
                    form.classList.remove('loading');
                    loginButton.textContent = 'دخول';
                }
            } catch (error) {
                console.error('Login error:', error);
                console.error('Error details:', {
                    message: error.message,
                    stack: error.stack
                });
                
                // Show more detailed error message
                const errorMsg = error.message || 'حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.';
                showError(errorMsg);
                form.classList.remove('loading');
                loginButton.textContent = 'دخول';
            }
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Check if already logged in
        if (localStorage.getItem('adminToken')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
